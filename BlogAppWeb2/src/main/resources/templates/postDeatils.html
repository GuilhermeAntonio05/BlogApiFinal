<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
    <head>
        <meta charset="ISO-8859-1">
        <title>App Blog</title>
        <!--Import bootstrap!-->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Web Blog</span>
                </div>
            </nav>
        </header>

        <main>
            <div class=" container" style="width: 60%, padding-bottom:30px">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item" aria-current="page"><a
                                href="/posts">Posts</a></li>
                        <li class="breadcrumb-item active"
                            aria-current="page">Post</li>
                    </ol>
                </nav>

                <article>
                    <h1 class="card-title"
                        style="font-weight: bold; margin-bottom: 20px">
                        <span th:text="${posts.titulo}"></span>
                    </h1>
                    <p class="card-subtitle mb-2 text-muted">
                        <i class="material-icons">person_outline</i>
                        <span th:text="${posts.autor}"></span>
                        <br>
                        <br>
                        <i class="material-icons">date_range</i>
                        <span th:text="${posts.data}"></span>
                    </p>
                    <section>
                        <p class="card-text" style="margin-top: 40px;">
                            <span th:utext="${posts.texto}"></span>
                        </p>
                    </section>

                    <hr>
					<a th:href="@{'/newpostcomment/' + ${posts.id}}">
						adicionar comentário
					</a>
					
					                    <div class="card" style="margin-top: 20px;"
                        th:each="comments: ${comments}">
                        <div class="card-body">
                            <p class="mb-0" th:text="${comments.data}"></p>
                            <span th:text="${comments.comentario}"></span>

                            <br>
							
                            <a
                                th:href="${(#mvc.url('BAC#getCommentEditDetails').arg(0, comments.id)).build()}">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    width="16" height="16" fill="currentColor"
                                    class="bi bi-pencil-square"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"></path>
                                    <path fill-rule="evenodd"
                                        d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"></path>
                                </svg>
                            </a>

                            <a
                                th:href="${(#mvc.url('BAC#deletePostComment').arg(0, comments.id)).build()}">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    width="16" height="16" fill="currentColor"
                                    class="bi bi-trash3-fill"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5" />
                                </svg>
                            </a>
                        </div>
                    </div>
                </article>

            </div>
        </main>

    </body>
</html>
